services:
  localstack:
    image: localstack/localstack:3
    container_name: notification-providers-localstack
    ports:
      - "4566:4566"   # LocalStack edge port (all services)
    environment:
      - SERVICES=sns
      - DEBUG=0
    volumes:
      - "./docker/localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: notification-providers-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI + REST API, used by MailpitClient in tests

  twiliomock:
    image: ghcr.io/dgates82/twilio-mock:1.0.0
    container_name: notification-providers-twiliomock
    ports:
      - "3030:3030" # web UI + Twilio-compatible REST API, used by TwilioMockClient in tests
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  sendgridmock:
    image: ghcr.io/dgates82/sendgrid-mock:1.0.0
    container_name: notification-providers-sendgridmock
    ports:
      - "3040:3040" # web UI + SendGrid-compatible REST API, used by SendGridMockClient in tests
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3040/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postmarkmock:
    image: ghcr.io/dgates82/postmark-mock:1.0.0
    container_name: notification-providers-postmarkmock
    ports:
      - "3050:3050" # web UI + Postmark-compatible REST API, used by PostmarkMockClient in tests
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3050/health"]
      interval: 5s
      timeout: 5s
      retries: 10
